name = "nickhub"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Serves the Worker on your domain once nickhub.com is on Cloudflare DNS
routes = [
  { pattern = "nickhub.com", custom_domain = true }
]

# Serve the dashboard from ./public; /api/* falls through to the Worker
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Created with: npx wrangler kv namespace create NICKHUB  (paste the id it prints)
[[kv_namespaces]]
binding = "NICKHUB"
id = "c7fb2934feaf4d398ef9c21b72036633"

# Characters live in D1, which shows a new upload to the very next request (KV takes up to a minute).
# Created with: npx wrangler d1 create nickhub, then: npx wrangler d1 execute nickhub --remote --file schema.sql
[[d1_databases]]
binding = "DB"
database_name = "nickhub"
database_id = "683b1a97-6f10-4cc7-9694-c0380916e049"
