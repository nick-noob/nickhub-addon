# Builds NickHub.exe (the racers' double-click uploader) on Windows, smoke-tests it
# against a fake WoW install, and attaches it to any GitHub release that's published.
name: Build NickHub app

on:
  push:
    branches: [main]
    paths: ["uploader/**", "addon/**", ".github/workflows/build-app.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # only used to attach the exe to a release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the release matches the addon's version
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $v = (Select-String -Path addon/NickHubTracker/NickHubTracker.toc -Pattern '^## Version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          if ("${{ github.event.release.tag_name }}" -ne "v$v") { throw "release ${{ github.event.release.tag_name }} doesn't match the .toc's Version $v. Bump the .toc, or name the release v$v" }

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.11.1

      - name: Build NickHub.exe
        run: pyinstaller --onefile --console --name NickHub --add-data "addon/NickHubTracker;NickHubTracker" uploader/nickhub_app.py

      - name: Smoke test against a fake WoW install
        shell: pwsh
        run: |
          $wow = Join-Path $env:RUNNER_TEMP "World of Warcraft"
          $sv = Join-Path $wow "_forever_\WTF\Account\TEST#1\SavedVariables"
          New-Item -ItemType Directory -Force -Path $sv | Out-Null
          Set-Content -Path (Join-Path $sv "NickHubTracker.lua") -Value @'
          NickHubTrackerDB = {
            ["version"] = 1,
            ["chars"] = {
              ["Forever-Ci Racer"] = { ["name"] = "Ci Racer", ["level"] = 3, ["updatedAt"] = 1, ["kills"] = { { ["k"] = "1" } } },
              ["Forever-Some Alt"] = { ["name"] = "Some Alt", ["level"] = 1, ["guid"] = "Player-1-0000000A" },
              ["Forever-Some"] = { ["name"] = "Some", ["level"] = 4 },
            },
          }
          '@
          $cfg = Join-Path $env:RUNNER_TEMP "config.json"
          '{"endpoint": "https://example.invalid/api/ingest", "token": "ci-only", "character": "Ci Racer"}' | Set-Content $cfg

          $out = & .\dist\NickHub.exe --check --wow-dir $wow --config $cfg | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "NickHub.exe exited with $LASTEXITCODE" }
          if ($out -notmatch "NickHub v\d+\.\d+\.\d+") { throw "the app didn't show its version" }
          if ($out -notmatch "Addon: installed") { throw "addon wasn't installed" }
          if (-not (Test-Path (Join-Path $wow "_forever_\Interface\AddOns\NickHubTracker\NickHubTracker.toc"))) { throw "addon files missing" }
          if ($out -notmatch "Would upload: Forever-Ci Racer: lvl 3") { throw "saved file wasn't read" }
          if ($out -notmatch "Forever-Some Alt") { throw "the racer's other characters weren't included" }
          if ($out -match "Forever-Some:") { throw "an old first-name entry without a guid was uploaded" }

          $again = & .\dist\NickHub.exe --check --wow-dir $wow --config $cfg | Out-String
          if ($again -notmatch "Addon: up to date") { throw "second run reinstalled the addon" }

          # the setup test must finish without waiting for Enter, and report an unreachable site
          $t = & .\dist\NickHub.exe --test --wow-dir $wow --config $cfg | Out-String
          Write-Host $t
          if ($t -notmatch "WoW Forever found") { throw "setup test didn't find WoW" }
          if ($t -notmatch "Couldn't reach nickhub.com") { throw "setup test didn't report the unreachable site" }

      - uses: actions/upload-artifact@v4
        with:
          name: NickHub
          path: dist/NickHub.exe

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/NickHub.exe --clobber
